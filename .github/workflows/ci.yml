name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest tests/

      - name: Test apps (pytest)
        run: |
          for app in achadinhos canal-dark instagram-automation pdf-factory solo-leveling-lab tiktok-shop; do
            (cd "apps/$app" && python -m pytest tests) || exit 1
          done
          (cd apps/whatsapp-notion-bot && python -m pytest whatsapp_notion_bot/tests)
